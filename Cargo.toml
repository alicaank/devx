[package]
name = "devx"
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
description = "Read-only diagnostics for development environments"
license = "MIT"
repository = "https://github.com/alicaank/devx"
readme = "README.md"
keywords = ["cli", "developer-tools", "diagnostics", "cuda", "disk-usage"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
trash = "5.2"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
